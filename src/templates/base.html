<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Discipline-Track{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a id="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="brand">Discipline-Track</span>
      <nav aria-label="Primary">
        <a href="{{ url_for('audit_page') }}" class="{% if request.path == '/' %}current{% endif %}" {% if request.path == '/' %}aria-current="page"{% endif %}>Audit</a>
        <a href="{{ url_for('log_page') }}" class="{% if request.path == '/log' %}current{% endif %}" {% if request.path == '/log' %}aria-current="page"{% endif %}>Log violation</a>
      </nav>
      <div class="display-controls">
        <button type="button" id="tour-start" title="Take a guided tour of this screen" aria-label="Take a guided tour of this screen">
          <svg class="bulb-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.3 2.2h4.6c.2-.9.6-1.6 1.3-2.2A6 6 0 0 0 12 3Z"/>
            <path d="M9.5 18.5h5"/>
            <path d="M10.5 21h3"/>
            <path class="bulb-filament" d="M10.2 13.8l1 2c.2.4 1.4.4 1.6 0l1-2"/>
            <g class="bulb-rays" opacity="0">
              <path d="M12 1.2v1.6"/>
              <path d="M5.2 4.8l1.1 1.1"/>
              <path d="M18.8 4.8l-1.1 1.1"/>
            </g>
          </svg>
          <span class="visually-hidden">Tour</span>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    <p>Records persist to the shared JSON file, so the terminal and web views stay in sync.</p>
  </footer>
  <script src="{{ url_for('static', filename='nav.js') }}" defer></script>
  <script src="{{ url_for('static', filename='tour.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
